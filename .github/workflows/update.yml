name: Update Sitemap

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate index and sitemap
        run: python update_sitemap.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html sitemap.xml notes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update note article index [skip ci]"
          # GitHub が commit_refs で弾くことがある。少し待ってからやり直す。
          i=1
          while [ "$i" -le 5 ]; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push failed (attempt ${i}), retrying"
            git pull --rebase origin main || true
            i=$((i + 1))
            sleep $((i * 10))
          done
          exit 1

